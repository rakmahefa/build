name: Remote Build Engine

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Target repository to build
        required: true
      branch:
        description: Target branch
        required: false
        default: main
      platform:
        description: Build platform
        required: true
        type: choice
        options:
          - android
          - linux
          - windows

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build engine
        uses: actions/checkout@v5

      - name: Checkout target project
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target

      - name: Prepare environment
        run: |
          chmod +x scripts/common/setup.sh
          ./scripts/common/setup.sh

      - name: Run build
        run: |
          chmod +x scripts/${{ inputs.platform }}/build.sh
          ./scripts/${{ inputs.platform }}/build.sh target

      - name: Collect artifacts
        run: |
          chmod +x scripts/common/artifacts.sh
          ./scripts/common/artifacts.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ inputs.platform }}
          path: output/
          if-no-files-found: warn
